name: tests

on:
  push:
    branches: [main, "feat/**"]
  pull_request:

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Install test dependencies
        run: python -m pip install -e ".[dev]"
      - name: Run unit tests
        run: python -m pytest -q
