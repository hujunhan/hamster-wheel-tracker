name: vision-tests

on:
  push:
    branches: [main, "feat/**"]
  pull_request:

jobs:
  synthetic-vision:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Install project and vision test dependencies
        run: |
          python -m pip install -e ".[dev]"
          python -m pip install numpy opencv-python-headless
      - name: Run pixel-level synthetic vision tests
        run: python -m pytest -q tests/test_synthetic_vision_pipeline.py
