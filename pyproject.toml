[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "hamster-wheel-tracker"
version = "0.1.0"
description = "Jetson Nano hamster wheel activity tracker using classical computer vision"
readme = "README.md"
requires-python = ">=3.8"
dependencies = [
  "fastapi>=0.110,<1",
  "uvicorn>=0.27,<1",
]

[project.optional-dependencies]
vision = ["numpy>=1.21", "opencv-python>=4.5"]
dev = ["pytest>=7", "httpx>=0.25,<1"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
